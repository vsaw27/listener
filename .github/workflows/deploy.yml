name: Deploy Node.js App to EC2 (Dynamic IP)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine if deployment is needed
        id: check_changes
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "First commit in repo. Deployment needed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- . ':!.github' ':!*.md')
            if [ -n "$CHANGED_FILES" ]; then
              echo "Changes detected in: $CHANGED_FILES"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "No application changes detected. Skipping."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure AWS Credentials
        if: steps.check_changes.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 and Resolve Dynamic IP
        if: steps.check_changes.outputs.deploy == 'true'
        id: ec2_setup
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current EC2 state: $STATE"

          if [ "$STATE" == "stopped" ]; then
            echo "Starting EC2 instance..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          elif [ "$STATE" != "running" ]; then
            echo "Waiting for instance to reach running state..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          fi

          DYNAMIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Instance dynamic IP is: $DYNAMIC_IP"
          echo "instance_ip=$DYNAMIC_IP" >> "$GITHUB_OUTPUT"

          echo "Waiting 25 seconds for SSH daemon initialization..."
          sleep 25

      - name: Deploy to EC2 via SSH
        if: steps.check_changes.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2_setup.outputs.instance_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            APP_DIR="/var/www/my-node-app"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "--- First time deployment: Cloning repository ---"
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
              npm ci --production
              pm2 start index.js --name "node-app"
              pm2 save
            else
              echo "--- Updating existing app: Pulling changes ---"
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
              npm ci --production
              pm2 reload "node-app" || pm2 start index.js --name "node-app"
              pm2 save
            fi

            echo "Deployment finished successfully."